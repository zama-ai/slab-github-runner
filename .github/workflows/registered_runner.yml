# This simple workflow is used to test if a runner is registered on GitHub platform.
name: Test registered runner

on:
  workflow_call:
    inputs:
      runner-name:
        required: true
        type: string

permissions: {}

jobs:
  test-runner:
    name: Test Runner
    runs-on: ${{ inputs.runner-name }}
    timeout-minutes: 10 # TEMP: raised so the 5 min sleep below can complete
    permissions:
      contents: read
    steps:
      - name: Runner registered
        run: |
          echo "Runner name: ${RUNNER_NAME}"
        env:
          RUNNER_NAME: ${{ inputs.runner-name }}

      # TEMP: keep the instance alive for 5 min
      - name: Idle
        run: sleep 300
