# Test action to start/stop already provisioned backend instance.
name: Test Start-Stop

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group:
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-runner-exist:
    name: Test runner is registered
    uses: ./.github/workflows/removed_runner.yml
    with:
      runner-name: ci-persistent-runner
      must-exist: true
    secrets:
      READ_REPO_TOKEN: ${{ secrets.SLAB_ACTION_TOKEN }}

  action-start:
    name: GitHub Actions Test (start)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required to join the tailnet via OIDC
    environment: ci-env
    needs: [test-runner-exist]
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Join tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_SLAB_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_SLAB_OAUTH_AUDIENCE }}
          tags: tag:slab-ci

      - name: Test start instance
        id: test-start
        uses: ./
        with:
          mode: start
          github-token: ${{ secrets.SLAB_ACTION_TOKEN }}
          slab-url: ${{ secrets.SLAB_BASE_URL_PRE_PROD }}
          job-secret: ${{ secrets.JOB_SECRET }}
          backend: aws
          profile: ci-test-start-stop

  test-runner-alive:
    name: Test runner is alive
    needs: [action-start]
    uses: ./.github/workflows/registered_runner.yml
    with:
      runner-name: ci-persistent-runner

  action-stop:
    name: GitHub Actions Test (stop)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required to join the tailnet via OIDC
    environment: ci-env
    needs: [action-start, test-runner-alive]
    if: ${{ always() && needs.action-start.result != 'skipped' }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Join tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_SLAB_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_SLAB_OAUTH_AUDIENCE }}
          tags: tag:slab-ci

      - name: Test stop instance
        id: test-stop
        uses: ./
        with:
          mode: stop
          github-token: ${{ secrets.SLAB_ACTION_TOKEN }}
          slab-url: ${{ secrets.SLAB_BASE_URL_PRE_PROD }}
          job-secret: ${{ secrets.JOB_SECRET }}
          label: ci-persistent-runner

  test-runner-persist:
    name: Test runner is still registered
    needs: [action-stop]
    uses: ./.github/workflows/removed_runner.yml
    with:
      runner-name: ci-persistent-runner
      must-exist: true
    secrets:
      READ_REPO_TOKEN: ${{ secrets.SLAB_ACTION_TOKEN }}
