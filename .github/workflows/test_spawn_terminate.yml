# Test action to spawn/terminate backend instance
name: Test Spawn-Terminate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group:
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  aws-provider:
    name: test_spawn_terminate/aws-provider (bpr)
    permissions:
      contents: read
      id-token: write # Required to join the tailnet via OIDC
    uses: ./.github/workflows/spawn_terminate_common.yml
    with:
      backend: aws
      profile: ci-test
    secrets:
      REPO_CHECKOUT_TOKEN: ${{ secrets.REPO_CHECKOUT_TOKEN }}
      JOB_SECRET: ${{ secrets.JOB_SECRET }}
      SLAB_ACTION_TOKEN: ${{ secrets.SLAB_ACTION_TOKEN }}
      SLAB_URL: ${{ secrets.SLAB_BASE_URL_PRE_PROD }}
      TS_SLAB_OAUTH_CLIENT_ID: ${{ secrets.TS_SLAB_OAUTH_CLIENT_ID }}
      TS_SLAB_OAUTH_AUDIENCE: ${{ secrets.TS_SLAB_OAUTH_AUDIENCE }}

  hyperstack-provider:
    name: test_spawn_terminate/hyperstack-provider (bpr)
    permissions:
      contents: read
      id-token: write # Required to join the tailnet via OIDC
    uses: ./.github/workflows/spawn_terminate_common.yml
    with:
      backend: hyperstack
      profile: ci-test
    secrets:
      REPO_CHECKOUT_TOKEN: ${{ secrets.REPO_CHECKOUT_TOKEN }}
      JOB_SECRET: ${{ secrets.JOB_SECRET }}
      SLAB_ACTION_TOKEN: ${{ secrets.SLAB_ACTION_TOKEN }}
      SLAB_URL: ${{ secrets.SLAB_BASE_URL_PRE_PROD }}
      TS_SLAB_OAUTH_CLIENT_ID: ${{ secrets.TS_SLAB_OAUTH_CLIENT_ID }}
      TS_SLAB_OAUTH_AUDIENCE: ${{ secrets.TS_SLAB_OAUTH_AUDIENCE }}

  # The primary profile is purposefully broken to check if Slab is using the fallback profile.
  fallback-profile-usage:
    name: test_spawn_terminate/fallback-profile-usage (bpr)
    permissions:
      contents: read
      id-token: write # Required to join the tailnet via OIDC
    uses: ./.github/workflows/spawn_terminate_common.yml
    with:
      backend: aws
      profile: broken-profile
    secrets:
      REPO_CHECKOUT_TOKEN: ${{ secrets.REPO_CHECKOUT_TOKEN }}
      JOB_SECRET: ${{ secrets.JOB_SECRET }}
      SLAB_ACTION_TOKEN: ${{ secrets.SLAB_ACTION_TOKEN }}
      SLAB_URL: ${{ secrets.SLAB_BASE_URL_PRE_PROD }}
      TS_SLAB_OAUTH_CLIENT_ID: ${{ secrets.TS_SLAB_OAUTH_CLIENT_ID }}
      TS_SLAB_OAUTH_AUDIENCE: ${{ secrets.TS_SLAB_OAUTH_AUDIENCE }}
